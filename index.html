<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>함께 배움 보드 (Focus Mode)</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-color: #f8f9fa;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-solid: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
            --radius-md: 16px;
            --radius-lg: 24px;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            display: flex; flex-direction: column;
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow-md);
        }

        /* --- 상단 주인공 영역 (타이틀 & 목표) --- */
        header {
            padding: 30px 40px; display: flex; justify-content: space-between; align-items: flex-start;
            position: relative; z-index: 20; pointer-events: none;
        }

        .hero-section {
            display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
            max-width: 70%;
        }

        .board-title { 
            font-size: 1.2rem; font-weight: 800; color: var(--primary); 
            margin: 0; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
        }

        .goal-input {
            border: none; background: transparent; font-size: 2.5rem; font-weight: 800; 
            color: var(--text-main); width: 100vw; max-width: 800px; outline: none; 
            letter-spacing: -1px; line-height: 1.2;
            transition: color 0.2s;
        }
        .goal-input::placeholder { color: #cbd5e1; }
        .goal-input:focus { color: var(--primary); }

        /* --- 타이머 영역 (미니멀리즘) --- */
        .timer-widget {
            display: flex; align-items: center; gap: 12px; pointer-events: auto;
            padding: 12px 24px; border-radius: 100px; background: var(--surface-solid);
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
        }
        
        .time-display { 
            font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; 
            letter-spacing: -1px; cursor: pointer; transition: color 0.2s;
        }
        .time-display:hover { color: var(--primary); }
        .time-display.warning { color: var(--accent); animation: pulse 1s infinite; }
        
        .timer-controls { display: flex; gap: 6px; }
        .btn-icon {
            width: 36px; height: 36px; border: none; border-radius: 50%;
            background: #f1f5f9; color: var(--text-main); font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-icon:hover { background: #e2e8f0; }
        .btn-icon.play { background: var(--primary); color: white; }
        .btn-icon.play:hover { background: var(--primary-hover); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- 메인 보드 (작업 영역) --- */
        main { flex-grow: 1; position: relative; overflow: hidden; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* 플로팅 툴바 */
        .floating-toolbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 8px; border-radius: 100px; display: flex; gap: 8px; z-index: 20;
        }

        .tool-btn {
            padding: 12px 24px; border: none; border-radius: 100px; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; gap: 8px; background: transparent;
            color: var(--text-muted); transition: all 0.2s ease;
        }
        .tool-btn:hover { background: rgba(0,0,0,0.04); color: var(--text-main); }
        .tool-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .tool-btn.danger { color: var(--accent); }
        .tool-btn.danger:hover { background: rgba(239, 68, 68, 0.1); }

        /* 학생 카드 (보드 위) */
        .board-card {
            position: absolute; width: 100px; height: 130px; background: var(--surface-solid);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            user-select: none; z-index: 5; transition: transform 0.1s, box-shadow 0.2s;
            border: 2px solid transparent;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .board-card .emoji-wrap { font-size: 2.5rem; }
        .board-card .name { font-weight: 700; color: var(--text-main); font-size: 1.05rem; }
        
        body[data-mode="move"] .board-card { cursor: grab; }
        body[data-mode="move"] .board-card:active { cursor: grabbing; z-index: 100; box-shadow: var(--shadow-lg); transform: scale(1.05); }
        body[data-mode="connect"] .board-card { cursor: crosshair; }
        body[data-mode="connect"] .board-card:hover { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* --- 하단 독 (학생 명단) --- */
        footer {
            height: 90px; background: var(--surface-solid); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; z-index: 50; box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
        }

        .dock-container {
            display: flex; gap: 12px; overflow-x: auto; flex-grow: 1; padding: 10px 0;
            scrollbar-width: none; /* Firefox */
        }
        .dock-container::-webkit-scrollbar { display: none; } /* Chrome */

        .student-chip {
            min-width: max-content; padding: 10px 20px; background: #f8fafc; 
            border: 1px solid var(--border); border-radius: 100px; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .student-chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
        .student-chip.completed { opacity: 0.4; pointer-events: none; background: #f1f5f9; box-shadow: none; }

        .settings-btn {
            min-width: 50px; height: 50px; border-radius: 50%; background: white; border: 1px solid var(--border);
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer;
            margin-left: 20px; box-shadow: var(--shadow-sm); transition: 0.2s;
        }
        .settings-btn:hover { background: #f1f5f9; }

        /* --- 모달 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface-solid); padding: 32px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); width: 420px; max-width: 90%; transform: scale(0.95); transition: 0.3s cubic-bezier(0.17, 0.88, 0.32, 1.27);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 1.4rem; font-weight: 800; margin: 0; }
        .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-muted); }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .modal-input { flex-grow: 1; padding: 14px; border: 1px solid var(--border); border-radius: 12px; outline: none; font-size: 1rem; }
        .btn-full { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        
        .edit-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .edit-item { display: flex; justify-content: space-between; padding: 12px; background: #f8fafc; border-radius: 12px; font-weight: 600; }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 20px; gap: 15px; }
            .hero-section { max-width: 100%; }
            .goal-input { font-size: 1.8rem; }
            .floating-toolbar { bottom: 10px; width: 95%; justify-content: space-between; padding: 8px 12px; }
            .tool-btn span { display: none; }
            .tool-btn::before { content: attr(data-icon); font-size: 1.5rem; }
        }
    </style>
</head>
<body data-mode="move">

    <header>
        <div class="hero-section">
            <h1 class="board-title">✨ 함께 배움 보드</h1>
            <input type="text" id="goalInput" class="goal-input" placeholder="오늘의 배움 목표를 입력하세요">
        </div>
        <div class="timer-widget">
            <div class="time-display" id="timeDisplay" onclick="setTimeManually()" title="클릭하여 시간 설정">20:00</div>
            <div class="timer-controls">
                <button class="btn-icon play" id="playBtn" onclick="toggleTimer()" title="시작/일시정지">▶</button>
                <button class="btn-icon" onclick="resetTimer()" title="리셋">🔄</button>
            </div>
        </div>
    </header>

    <main id="board">
        <canvas id="canvas"></canvas>
        
        <div class="floating-toolbar glass">
            <button class="tool-btn active" id="btnMoveMode" data-icon="🖐️" onclick="setMode('move')"><span>이동 모드</span></button>
            <button class="tool-btn" id="btnConnectMode" data-icon="🔗" onclick="setMode('connect')"><span>배움 릴레이</span></button>
            <div style="width: 1px; background:var(--border); margin: 0 4px;"></div>
            <button class="tool-btn" data-icon="📊" onclick="showInsights()"><span>인사이트</span></button>
            <button class="tool-btn danger" data-icon="🧹" onclick="clearLines()"><span>선 지우기</span></button>
            <button class="tool-btn danger" data-icon="🗑️" onclick="resetBoard()"><span>초기화</span></button>
        </div>
    </main>

    <footer>
        <div class="dock-container" id="studentDock"></div>
        <button class="settings-btn" onclick="openModal('studentModal')" title="명단 설정">⚙️</button>
    </footer>

    <div class="modal-overlay" id="studentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">학생 명단 관리</h3>
                <button class="close-btn" onclick="closeModal('studentModal')">✕</button>
            </div>
            <div class="input-group">
                <input type="text" id="newStudentName" class="modal-input" placeholder="이름 입력 후 엔터" onkeypress="if(event.key==='Enter') addStudent()">
                <button class="btn-full" style="width: 80px;" onclick="addStudent()">추가</button>
            </div>
            <div class="edit-list" id="editStudentList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="insightModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">오늘의 배움 나눔 왕 👑</h3>
                <button class="close-btn" onclick="closeModal('insightModal')">✕</button>
            </div>
            <div id="insightList" class="edit-list" style="max-height: 400px; margin-bottom: 0;"></div>
        </div>
    </div>

<script>
    /* 사운드 엔진 */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'connect') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    /* 전역 상태 */
    const EMOJIS = ["🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮", "🐷", "🐸", "🐵"];
    let students = JSON.parse(localStorage.getItem('edu_students')) || ["김민준", "이서연", "박지우", "최예준", "정윤아", "강도윤"];
    let activeCards = {}, connections = [], mode = 'move';
    let isDrawing = false, startCardId = null, mousePos = { x: 0, y: 0 }, dashOffset = 0;

    const board = document.getElementById('board');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    /* 초기화 */
    function init() {
        document.getElementById('goalInput').value = localStorage.getItem('edu_goal') || "목표: 수익 12~13쪽 해결하기";
        document.getElementById('goalInput').addEventListener('input', e => localStorage.setItem('edu_goal', e.target.value));

        renderDock();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        board.addEventListener('mousemove', handlePointerMove);
        board.addEventListener('touchmove', handlePointerMove, {passive: false});
        board.addEventListener('mouseup', handlePointerUp);
        board.addEventListener('touchend', handlePointerUp);
        
        requestAnimationFrame(animateCanvas);
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        // 하단 독 가로 스크롤 (마우스 휠) 지원
        const dock = document.getElementById('studentDock');
        dock.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) { e.preventDefault(); dock.scrollLeft += e.deltaY; }
        });
    }

    function resizeCanvas() { canvas.width = board.clientWidth; canvas.height = board.clientHeight; }

    function getEmoji(name) {
        let hash = 0; for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
        return EMOJIS[hash % EMOJIS.length];
    }

    /* 하단 독(명단) 렌더링 */
    function renderDock() {
        const dock = document.getElementById('studentDock');
        dock.innerHTML = '';
        students.forEach((name, index) => {
            const chip = document.createElement('div');
            chip.className = 'student-chip';
            chip.id = `dock-item-${index}`;
            chip.innerHTML = `<span style="font-size:1.2rem">${getEmoji(name)}</span> <span>${name}</span>`;
            chip.onclick = () => addCardToBoard(name, index, chip);
            dock.appendChild(chip);
        });
    }

    /* 카드 생성 및 이벤트 */
    function addCardToBoard(name, index, chipEl) {
        if(chipEl.classList.contains('completed')) return;
        playSound('pop');
        chipEl.classList.add('completed');

        const cardId = 'card-' + Date.now();
        const card = document.createElement('div');
        card.className = 'board-card';
        card.id = cardId;
        
        // 보드 중앙 근처에 생성
        const startX = (board.clientWidth / 2) - 50 + (Math.random() * 60 - 30);
        const startY = (board.clientHeight / 2) - 65 + (Math.random() * 60 - 30);
        card.style.left = startX + 'px'; card.style.top = startY + 'px';
        
        card.innerHTML = `<div class="emoji-wrap">${getEmoji(name)}</div><div class="name">${name}</div>`;
        board.appendChild(card);
        activeCards[cardId] = { name: name, el: card, dockId: chipEl.id };

        card.addEventListener('mousedown', (e) => handleCardPointerDown(e, cardId));
        card.addEventListener('touchstart', (e) => handleCardPointerDown(e, cardId), {passive: false});
    }

    function handleCardPointerDown(e, cardId) {
        if (mode === 'move') {
            e.preventDefault();
            const cardEl = activeCards[cardId].el;
            const isTouch = e.type === 'touchstart';
            let startX = isTouch ? e.touches[0].clientX : e.clientX;
            let startY = isTouch ? e.touches[0].clientY : e.clientY;
            let origX = cardEl.offsetLeft, origY = cardEl.offsetTop;

            function doDrag(dragEvent) {
                if(isTouch) dragEvent.preventDefault();
                const currentX = isTouch ? dragEvent.touches[0].clientX : dragEvent.clientX;
                const currentY = isTouch ? dragEvent.touches[0].clientY : dragEvent.clientY;
                cardEl.style.left = (origX + currentX - startX) + 'px';
                cardEl.style.top = (origY + currentY - startY) + 'px';
            }
            function stopDrag() {
                document.removeEventListener(isTouch ? 'touchmove' : 'mousemove', doDrag);
                document.removeEventListener(isTouch ? 'touchend' : 'mouseup', stopDrag);
            }
            document.addEventListener(isTouch ? 'touchmove' : 'mousemove', doDrag, {passive: false});
            document.addEventListener(isTouch ? 'touchend' : 'mouseup', stopDrag);
        } else if (mode === 'connect') {
            e.preventDefault(); e.stopPropagation();
            isDrawing = true; startCardId = cardId; updatePointerPos(e);
        }
    }

    function handlePointerMove(e) { if (isDrawing) { e.preventDefault(); updatePointerPos(e); } }

    function handlePointerUp(e) {
        if (isDrawing) {
            isDrawing = false;
            let targetEl = e.type === 'touchend' ? document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY) : e.target;
            const targetCard = targetEl ? targetEl.closest('.board-card') : null;
            
            if (targetCard && targetCard.id !== startCardId) {
                if (!connections.find(c => c.from === startCardId && c.to === targetCard.id)) {
                    connections.push({ from: startCardId, to: targetCard.id });
                    playSound('connect');
                }
            }
            startCardId = null;
        }
    }

    function updatePointerPos(e) {
        const rect = board.getBoundingClientRect();
        mousePos.x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        mousePos.y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    }

    /* 모드 전환 및 보드 초기화 */
    function setMode(newMode) {
        mode = newMode; document.body.setAttribute('data-mode', mode);
        document.getElementById('btnMoveMode').classList.toggle('active', mode === 'move');
        document.getElementById('btnConnectMode').classList.toggle('active', mode === 'connect');
    }
    function clearLines() { connections = []; }
    function resetBoard() {
        if(confirm("보드를 초기화하시겠습니까?")) {
            Object.values(activeCards).forEach(c => c.el.remove());
            activeCards = {}; connections = [];
            document.querySelectorAll('.student-chip').forEach(el => el.classList.remove('completed'));
        }
    }

    /* 캔버스 드로잉 */
    function getCardCenter(cardId) {
        if(!activeCards[cardId]) return null;
        const el = activeCards[cardId].el;
        return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
    }

    function animateCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dashOffset -= 0.8;
        ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(37, 99, 235, 0.3)';

        connections.forEach(conn => {
            const p1 = getCardCenter(conn.from); const p2 = getCardCenter(conn.to);
            if(p1 && p2) drawSmoothCurve(p1, p2, false);
        });

        if (isDrawing && startCardId) {
            const p1 = getCardCenter(startCardId);
            if(p1) drawSmoothCurve(p1, mousePos, true);
        }
        ctx.shadowBlur = 0; requestAnimationFrame(animateCanvas);
    }

    function drawSmoothCurve(p1, p2, isTemp) {
        const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.sqrt(dx*dx + dy*dy);
        const curveOffset = Math.min(dist * 0.25, 100); 
        const cp1x = p1.x + dx/2 - dy/dist * curveOffset, cp1y = p1.y + dy/2 + dx/dist * curveOffset;

        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.quadraticCurveTo(cp1x, cp1y, p2.x, p2.y);

        if (isTemp) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]); ctx.stroke();
        } else {
            ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 4; ctx.setLineDash([12, 12]);
            ctx.lineDashOffset = dashOffset; ctx.lineCap = 'round'; ctx.stroke();

            const t = 0.85; 
            const arrowX = (1-t)*(1-t)*p1.x + 2*(1-t)*t*cp1x + t*t*p2.x;
            const arrowY = (1-t)*(1-t)*p1.y + 2*(1-t)*t*cp1y + t*t*p2.y;
            const tx = 2*(1-t)*(cp1x - p1.x) + 2*t*(p2.x - cp1x), ty = 2*(1-t)*(cp1y - p1.y) + 2*t*(p2.y - cp1y);
            const angle = Math.atan2(ty, tx);

            ctx.beginPath(); ctx.setLineDash([]); ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 14 * Math.cos(angle - Math.PI / 7), arrowY - 14 * Math.sin(angle - Math.PI / 7));
            ctx.lineTo(arrowX - 14 * Math.cos(angle + Math.PI / 7), arrowY - 14 * Math.sin(angle + Math.PI / 7));
            ctx.closePath(); ctx.fillStyle = '#2563eb'; ctx.fill();
        }
    }

    /* 심플 타이머 로직 */
    let timeTotalSeconds = 20 * 60;
    let timeRemaining = timeTotalSeconds;
    let timerInterval = null, isPlaying = false;
    const timeDisplay = document.getElementById('timeDisplay');
    const playBtn = document.getElementById('playBtn');

    function updateTimeDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        timeDisplay.innerText = `${m}:${s}`;
        timeDisplay.classList.toggle('warning', timeRemaining <= 60 && timeRemaining > 0);
    }

    // 시간 직접 클릭해서 설정
    function setTimeManually() {
        if(isPlaying) toggleTimer(); // 설정 시 일시정지
        const inputStr = prompt("타이머 시간을 분 단위로 입력하세요 (예: 15)", Math.floor(timeTotalSeconds / 60));
        if (inputStr !== null && !isNaN(inputStr) && inputStr.trim() !== "") {
            const mins = parseInt(inputStr, 10);
            if (mins > 0) {
                timeTotalSeconds = mins * 60;
                timeRemaining = timeTotalSeconds;
                updateTimeDisplay();
            }
        }
    }

    function toggleTimer() {
        if(isPlaying) {
            clearInterval(timerInterval); playBtn.innerHTML = '▶';
        } else {
            if(timeRemaining <= 0) return;
            timerInterval = setInterval(() => {
                timeRemaining--; updateTimeDisplay();
                if(timeRemaining <= 0) {
                    clearInterval(timerInterval); toggleTimer();
                    alert("⏰ 시간이 종료되었습니다!");
                }
            }, 1000);
            playBtn.innerHTML = '⏸';
        }
        isPlaying = !isPlaying;
    }

    function resetTimer() {
        clearInterval(timerInterval); isPlaying = false;
        playBtn.innerHTML = '▶'; timeRemaining = timeTotalSeconds;
        updateTimeDisplay();
    }

    /* 명단 관리 및 인사이트 */
    function saveStudents() { localStorage.setItem('edu_students', JSON.stringify(students)); renderDock(); renderEditList(); }
    function addStudent() {
        const input = document.getElementById('newStudentName');
        if(input.value.trim()) { students.push(input.value.trim()); input.value = ''; saveStudents(); }
    }
    function deleteStudent(index) { students.splice(index, 1); saveStudents(); }

    function renderEditList() {
        const list = document.getElementById('editStudentList'); list.innerHTML = '';
        students.forEach((name, i) => {
            list.innerHTML += `<div class="edit-item"><span>${name}</span> <button class="close-btn" style="color:var(--accent); font-size:1.2rem;" onclick="deleteStudent(${i})">✕</button></div>`;
        });
    }

    function showInsights() {
        const counts = {}; connections.forEach(c => { counts[c.from] = (counts[c.from] || 0) + 1; });
        let stats = Object.keys(activeCards).map(id => ({ name: activeCards[id].name, count: counts[id] || 0 })).sort((a, b) => b.count - a.count);
        const list = document.getElementById('insightList'); list.innerHTML = '';
        
        if(!stats.length || stats[0].count === 0) {
            list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">아직 나눔 기록이 없습니다.</div>';
        } else {
            stats.forEach((s, i) => {
                if(s.count > 0) {
                    const rank = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
                    list.innerHTML += `<div class="edit-item" style="align-items:center;">
                        <div><span style="font-size:1.2rem; width:30px; display:inline-block;">${rank}</span> ${s.name}</div>
                        <div style="color:var(--primary);">${s.count}회 나눔</div>
                    </div>`;
                }
            });
        }
        openModal('insightModal');
    }

    function openModal(id) { if(id === 'studentModal') renderEditList(); document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    window.onload = init;
</script>
</body>
</html>
