<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>함께 배움 보드 (Pro Version)</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* Apple/Google 스타일의 모던 컬러 팔레트 */
            --bg-color: #f5f5f7;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --primary: #0066cc;
            --primary-hover: #0055b3;
            --accent: #ff3b30;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 30px;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-primary);
            /* 모던한 도트 배경 */
            background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        #app { display: flex; height: 100vh; position: relative; }

        /* --- Glassmorphism 공통 유틸리티 --- */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow-md);
        }

        /* --- 사이드바 (학생 명단) --- */
        #sidebar {
            width: 280px; background: var(--surface-solid); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 50; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 24px 20px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header h2 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .icon-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            padding: 8px; border-radius: 50%; transition: background 0.2s; color: var(--text-secondary);
        }
        .icon-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }

        .student-list { padding: 0 16px 20px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        
        .student-item {
            background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 14px 16px; cursor: pointer; font-weight: 600; font-size: 1rem;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease; box-shadow: var(--shadow-sm);
        }
        .student-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-md); color: var(--primary); }
        .student-item.completed { opacity: 0.5; pointer-events: none; background: #f9f9f9; box-shadow: none; }

        /* 모바일 사이드바 토글 버튼 */
        #mobile-menu-btn {
            display: none; position: absolute; top: 20px; left: 20px; z-index: 100;
            background: var(--surface-solid); border-radius: 50%; width: 44px; height: 44px;
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
            justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer;
        }

        /* --- 메인 보드 --- */
        #board { flex-grow: 1; position: relative; overflow: hidden; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* --- 상단 컨트롤 (타이틀 & 타이머) --- */
        #top-bar {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; z-index: 20; width: max-content; max-width: 90%;
        }

        .header-widget {
            padding: 16px 24px; border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 6px;
        }

        .board-title { font-size: 0.9rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .goal-input {
            border: none; background: transparent; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);
            width: 100%; min-width: 250px; outline: none; text-align: left;
        }
        .goal-input::placeholder { color: var(--text-secondary); font-weight: 500; }

        .timer-widget {
            padding: 12px 24px; border-radius: var(--radius-lg); display: flex; align-items: center; gap: 16px;
        }
        .time-display { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        .time-display.warning { color: var(--accent); animation: pulse 1s infinite; }
        
        .timer-controls { display: flex; gap: 8px; }
        .btn-small {
            padding: 8px 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; background: rgba(0,0,0,0.05); color: var(--text-primary); transition: 0.2s;
        }
        .btn-small:hover { background: rgba(0,0,0,0.1); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- 하단 플로팅 툴바 (모던 디자인) --- */
        .bottom-toolbar {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            padding: 8px; border-radius: 100px; display: flex; gap: 8px; z-index: 20;
        }

        .tool-btn {
            padding: 12px 24px; border: none; border-radius: 100px; font-weight: 600; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; gap: 8px; background: transparent;
            color: var(--text-secondary); transition: all 0.2s ease;
        }
        .tool-btn:hover { background: rgba(0,0,0,0.04); color: var(--text-primary); }
        .tool-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3); }
        .tool-btn.danger { color: var(--accent); }
        .tool-btn.danger:hover { background: rgba(255, 59, 48, 0.1); }

        /* --- 학생 카드 (보드 위) --- */
        .board-card {
            position: absolute; width: 100px; height: 130px; background: var(--surface-solid);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            user-select: none; z-index: 5; transition: box-shadow 0.2s, border-color 0.2s;
            border: 2px solid transparent; transform-origin: center center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .board-card .emoji-wrap {
            width: 56px; height: 56px; background: #f0f4f8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
        }
        .board-card .name { font-weight: 700; color: var(--text-primary); font-size: 1.05rem; }
        
        /* 모드별 인터랙션 */
        body[data-mode="move"] .board-card { cursor: grab; }
        body[data-mode="move"] .board-card:active { cursor: grabbing; z-index: 100; box-shadow: var(--shadow-lg); transform: scale(1.05); }
        body[data-mode="connect"] .board-card { cursor: crosshair; }
        body[data-mode="connect"] .board-card:hover { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); }

        /* --- 모달 (팝업) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background: var(--surface-solid); padding: 32px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); width: 420px; max-width: 90%; transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 1.4rem; font-weight: 800; margin: 0; }
        
        /* 인풋 및 버튼 리스트 */
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .modal-input { flex-grow: 1; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; outline: none; transition: border 0.2s; }
        .modal-input:focus { border-color: var(--primary); }
        
        .btn-full { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn-full:hover { background: var(--primary-hover); }

        .edit-list { max-height: 300px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .edit-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f9f9f9; border-radius: var(--radius-sm); font-weight: 600; }

        .insight-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .insight-item:last-child { border-bottom: none; }
        .insight-rank { font-size: 1.5rem; width: 40px; text-align: center; }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- 반응형 (모바일/소형 스크린) 최적화 --- */
        @media (max-width: 900px) {
            #mobile-menu-btn { display: flex; }
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); box-shadow: var(--shadow-lg); }
            #sidebar.open { transform: translateX(0); }
            
            #top-bar { top: 20px; flex-direction: column; align-items: center; gap: 10px; width: 100%; padding: 0 20px; left: 50%; transform: translateX(-50%); pointer-events: none;}
            .header-widget, .timer-widget { width: 100%; justify-content: center; pointer-events: auto; }
            .goal-input { text-align: center; }
            
            .bottom-toolbar { bottom: 20px; width: 90%; justify-content: space-between; padding: 12px 20px; }
            .tool-btn { flex-direction: column; font-size: 0.75rem; padding: 8px; gap: 4px; border-radius: 12px; }
            .tool-btn span { display: none; } /* 텍스트 숨기고 아이콘만 */
            .tool-btn::before { content: attr(data-icon); font-size: 1.5rem; }
        }
    </style>
</head>
<body data-mode="move">

<div id="app">
    <button id="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>🧑‍🏫 학생 명단</h2>
            <button class="icon-btn" onclick="openModal('studentModal')" title="명단 설정">⚙️</button>
        </div>
        <div class="student-list" id="studentList"></div>
    </aside>

    <main id="board">
        <div id="top-bar">
            <div class="header-widget glass">
                <p class="board-title">✨ 함께 배움 보드</p>
                <input type="text" id="goalInput" class="goal-input" placeholder="오늘의 배움 목표를 입력하세요">
            </div>

            <div class="timer-widget glass">
                <div class="time-display" id="timeDisplay">20:00</div>
                <div class="timer-controls">
                    <button class="btn-small" onclick="adjustTime(-1)">-1분</button>
                    <button class="btn-small btn-primary" id="playBtn" onclick="toggleTimer()">▶ 시작</button>
                    <button class="btn-small" onclick="resetTimer()">🔄 리셋</button>
                    <button class="btn-small" onclick="adjustTime(1)">+1분</button>
                </div>
            </div>
        </div>

        <div class="bottom-toolbar glass">
            <button class="tool-btn active" id="btnMoveMode" data-icon="🖐️" onclick="setMode('move')"><span>이동 모드</span></button>
            <button class="tool-btn" id="btnConnectMode" data-icon="🔗" onclick="setMode('connect')"><span>배움 릴레이</span></button>
            <div style="width: 1px; background:var(--border); margin: 0 8px;"></div>
            <button class="tool-btn" data-icon="📊" onclick="showInsights()"><span>인사이트</span></button>
            <button class="tool-btn danger" data-icon="🧹" onclick="clearLines()"><span>선 지우기</span></button>
            <button class="tool-btn danger" data-icon="🗑️" onclick="resetBoard()"><span>초기화</span></button>
        </div>

        <canvas id="canvas"></canvas>
    </main>
</div>

<div class="modal-overlay" id="studentModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">학생 명단 관리</h3>
            <button class="icon-btn" onclick="closeModal('studentModal')">✕</button>
        </div>
        <div class="input-group">
            <input type="text" id="newStudentName" class="modal-input" placeholder="이름 입력 후 엔터" onkeypress="if(event.key==='Enter') addStudent()">
            <button class="btn-small btn-primary" style="padding: 0 20px;" onclick="addStudent()">추가</button>
        </div>
        <div class="edit-list" id="editStudentList"></div>
    </div>
</div>

<div class="modal-overlay" id="insightModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">오늘의 배움 나눔 왕 👑</h3>
            <button class="icon-btn" onclick="closeModal('insightModal')">✕</button>
        </div>
        <p style="color: var(--text-secondary); margin-top: -10px; margin-bottom: 20px;">친구들에게 도움을 가장 많이 준 학생들입니다.</p>
        <div id="insightList" class="edit-list" style="max-height: 400px;"></div>
    </div>
</div>

<script>
    /* ==========================================
       사운드 엔진 (Web Audio API - 외부 파일 불필요)
    ========================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        if (type === 'pop') { // 카드 생성 시
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'connect') { // 연결 성공 시 (청아한 소리)
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now); // A4
            osc.frequency.setValueAtTime(554.37, now + 0.1); // C#5
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'alert') { // 타이머 종료 시
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.2);
            osc.frequency.setValueAtTime(400, now + 0.4);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.8);
            osc.start(now); osc.stop(now + 0.8);
        }
    }

    /* ==========================================
       데이터 및 기본 설정
    ========================================== */
    const EMOJIS = ["🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮", "🐷", "🐸", "🐵", "🐧"];
    let students = JSON.parse(localStorage.getItem('edu_students')) || ["김민준", "이서연", "박지우", "최예준", "정윤아", "강도윤"];
    let savedGoal = localStorage.getItem('edu_goal') || "목표: 수익 12~13쪽 해결하기";
    
    let activeCards = {}; 
    let connections = []; 
    let mode = 'move'; 

    const board = document.getElementById('board');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false, startCardId = null, mousePos = { x: 0, y: 0 }, dashOffset = 0;

    /* ==========================================
       초기화
    ========================================== */
    function init() {
        document.getElementById('goalInput').value = savedGoal;
        document.getElementById('goalInput').addEventListener('input', (e) => {
            localStorage.setItem('edu_goal', e.target.value);
        });

        renderSidebar();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 터치 및 마우스 이벤트 (연결 모드 지원)
        board.addEventListener('mousemove', handlePointerMove);
        board.addEventListener('touchmove', handlePointerMove, {passive: false});
        board.addEventListener('mouseup', handlePointerUp);
        board.addEventListener('touchend', handlePointerUp);
        
        requestAnimationFrame(animateCanvas);
        
        // 초기 오디오 컨텍스트 활성화를 위한 리스너 (브라우저 정책)
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    }

    function resizeCanvas() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function renderSidebar() {
        const list = document.getElementById('studentList');
        list.innerHTML = '';
        students.forEach((name, index) => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `<span>${name}</span> <span style="color:var(--text-secondary); font-size:1.2rem;">+</span>`;
            div.id = `sidebar-item-${index}`;
            div.onclick = () => addCardToBoard(name, index, div);
            list.appendChild(div);
        });
    }

    function getEmoji(name) {
        let hash = 0; for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
        return EMOJIS[hash % EMOJIS.length];
    }

    /* ==========================================
       카드 컨트롤 (생성, 드래그, 터치)
    ========================================== */
    function addCardToBoard(name, index, sidebarEl) {
        if(sidebarEl.classList.contains('completed')) return;
        playSound('pop');
        sidebarEl.classList.add('completed');
        if(window.innerWidth <= 900) toggleSidebar(); // 모바일에서 카드 추가 시 사이드바 닫기

        const cardId = 'card-' + Date.now();
        const card = document.createElement('div');
        card.className = 'board-card';
        card.id = cardId;
        
        // 화면 중앙 부근에 생성
        const startX = (board.clientWidth / 2) - 50 + (Math.random() * 40 - 20);
        const startY = (board.clientHeight / 2) - 65 + (Math.random() * 40 - 20);
        
        card.style.left = startX + 'px';
        card.style.top = startY + 'px';
        
        card.innerHTML = `<div class="emoji-wrap">${getEmoji(name)}</div><div class="name">${name}</div>`;
        board.appendChild(card);

        activeCards[cardId] = { name: name, el: card, sidebarId: sidebarEl.id };

        // 마우스 & 터치 이벤트
        card.addEventListener('mousedown', (e) => handleCardPointerDown(e, cardId));
        card.addEventListener('touchstart', (e) => handleCardPointerDown(e, cardId), {passive: false});
    }

    function handleCardPointerDown(e, cardId) {
        if (mode === 'move') {
            e.preventDefault();
            const cardEl = activeCards[cardId].el;
            const isTouch = e.type === 'touchstart';
            let startX = isTouch ? e.touches[0].clientX : e.clientX;
            let startY = isTouch ? e.touches[0].clientY : e.clientY;
            let origX = cardEl.offsetLeft, origY = cardEl.offsetTop;

            function doDrag(dragEvent) {
                if(isTouch) dragEvent.preventDefault(); // 스크롤 방지
                const currentX = isTouch ? dragEvent.touches[0].clientX : dragEvent.clientX;
                const currentY = isTouch ? dragEvent.touches[0].clientY : dragEvent.clientY;
                cardEl.style.left = (origX + currentX - startX) + 'px';
                cardEl.style.top = (origY + currentY - startY) + 'px';
            }
            function stopDrag() {
                document.removeEventListener(isTouch ? 'touchmove' : 'mousemove', doDrag);
                document.removeEventListener(isTouch ? 'touchend' : 'mouseup', stopDrag);
            }
            document.addEventListener(isTouch ? 'touchmove' : 'mousemove', doDrag, {passive: false});
            document.addEventListener(isTouch ? 'touchend' : 'mouseup', stopDrag);
        } 
        else if (mode === 'connect') {
            e.preventDefault(); e.stopPropagation();
            isDrawing = true; startCardId = cardId;
            updatePointerPos(e);
        }
    }

    function handlePointerMove(e) {
        if (isDrawing) {
            e.preventDefault(); // 모바일 스크롤 방지
            updatePointerPos(e);
        }
    }

    function handlePointerUp(e) {
        if (isDrawing) {
            isDrawing = false;
            // 터치 이벤트 대응을 위해 document.elementFromPoint 사용
            let targetEl = e.target;
            if (e.type === 'touchend') {
                const touch = e.changedTouches[0];
                targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            }
            
            const targetCard = targetEl ? targetEl.closest('.board-card') : null;
            
            if (targetCard && targetCard.id !== startCardId) {
                const exists = connections.find(c => c.from === startCardId && c.to === targetCard.id);
                if (!exists) {
                    connections.push({ from: startCardId, to: targetCard.id });
                    playSound('connect');
                }
            }
            startCardId = null;
        }
    }

    function updatePointerPos(e) {
        const rect = board.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        mousePos.x = clientX - rect.left;
        mousePos.y = clientY - rect.top;
    }

    /* ==========================================
       메뉴 컨트롤
    ========================================== */
    function setMode(newMode) {
        mode = newMode;
        document.body.setAttribute('data-mode', mode);
        document.getElementById('btnMoveMode').classList.toggle('active', mode === 'move');
        document.getElementById('btnConnectMode').classList.toggle('active', mode === 'connect');
    }

    function clearLines() { connections = []; }
    function resetBoard() {
        if(confirm("보드를 초기화하시겠습니까?")) {
            Object.values(activeCards).forEach(c => c.el.remove());
            activeCards = {}; connections = [];
            document.querySelectorAll('.student-item').forEach(el => el.classList.remove('completed'));
        }
    }

    /* ==========================================
       캔버스 드로잉 (하이퀄리티 곡선)
    ========================================== */
    function getCardCenter(cardId) {
        if(!activeCards[cardId]) return null;
        const el = activeCards[cardId].el;
        return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
    }

    function animateCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dashOffset -= 0.8; // 애니메이션 속도

        // 글로우 효과 설정
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(0, 102, 204, 0.3)';

        connections.forEach(conn => {
            const p1 = getCardCenter(conn.from);
            const p2 = getCardCenter(conn.to);
            if(p1 && p2) drawSmoothCurve(p1, p2, false);
        });

        if (isDrawing && startCardId) {
            const p1 = getCardCenter(startCardId);
            if(p1) drawSmoothCurve(p1, mousePos, true);
        }

        ctx.shadowBlur = 0; // 초기화
        requestAnimationFrame(animateCanvas);
    }

    function drawSmoothCurve(p1, p2, isTemp) {
        const dx = p2.x - p1.x; const dy = p2.y - p1.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        const curveOffset = Math.min(distance * 0.25, 100); 
        
        const cp1x = p1.x + dx/2 - dy/distance * curveOffset;
        const cp1y = p1.y + dy/2 + dx/distance * curveOffset;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.quadraticCurveTo(cp1x, cp1y, p2.x, p2.y);

        if (isTemp) {
            ctx.strokeStyle = '#c7d2fe'; // 연한 블루
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
        } else {
            ctx.strokeStyle = '#0066cc'; // 프라이머리 블루
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 12]);
            ctx.lineDashOffset = dashOffset;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 세련된 화살표 머리
            const t = 0.85; 
            const arrowX = (1-t)*(1-t)*p1.x + 2*(1-t)*t*cp1x + t*t*p2.x;
            const arrowY = (1-t)*(1-t)*p1.y + 2*(1-t)*t*cp1y + t*t*p2.y;
            const tx = 2*(1-t)*(cp1x - p1.x) + 2*t*(p2.x - cp1x);
            const ty = 2*(1-t)*(cp1y - p1.y) + 2*t*(p2.y - cp1y);
            const angle = Math.atan2(ty, tx);

            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 14 * Math.cos(angle - Math.PI / 7), arrowY - 14 * Math.sin(angle - Math.PI / 7));
            ctx.lineTo(arrowX - 14 * Math.cos(angle + Math.PI / 7), arrowY - 14 * Math.sin(angle + Math.PI / 7));
            ctx.closePath();
            ctx.fillStyle = '#0066cc';
            ctx.fill();
        }
    }

    /* ==========================================
       타이머 시스템
    ========================================== */
    let timeRemaining = 20 * 60;
    let timerInterval = null;
    let isPlaying = false;
    const timeDisplay = document.getElementById('timeDisplay');
    const playBtn = document.getElementById('playBtn');

    function updateTimeDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        timeDisplay.innerText = `${m}:${s}`;
        
        if(timeRemaining <= 60 && timeRemaining > 0) timeDisplay.classList.add('warning');
        else timeDisplay.classList.remove('warning');
    }

    function adjustTime(minutes) {
        timeRemaining += minutes * 60;
        if(timeRemaining < 0) timeRemaining = 0;
        updateTimeDisplay();
    }

    function toggleTimer() {
        if(isPlaying) {
            clearInterval(timerInterval);
            playBtn.innerHTML = '▶ 시작';
        } else {
            if(timeRemaining <= 0) return;
            timerInterval = setInterval(() => {
                timeRemaining--; updateTimeDisplay();
                if(timeRemaining <= 0) {
                    clearInterval(timerInterval); toggleTimer();
                    playSound('alert'); // 타이머 종료음
                    alert("⏰ 시간이 종료되었습니다!");
                }
            }, 1000);
            playBtn.innerHTML = '⏸ 정지';
        }
        isPlaying = !isPlaying;
    }

    function resetTimer() {
        clearInterval(timerInterval); isPlaying = false;
        playBtn.innerHTML = '▶ 시작'; timeRemaining = 20 * 60;
        updateTimeDisplay();
    }

    /* ==========================================
       명단 관리 및 인사이트
    ========================================== */
    function saveStudents() {
        localStorage.setItem('edu_students', JSON.stringify(students));
        renderSidebar(); renderEditList();
    }

    function addStudent() {
        const input = document.getElementById('newStudentName');
        const name = input.value.trim();
        if(name) { students.push(name); input.value = ''; saveStudents(); }
    }

    function deleteStudent(index) { students.splice(index, 1); saveStudents(); }

    function renderEditList() {
        const list = document.getElementById('editStudentList');
        list.innerHTML = '';
        students.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'edit-item';
            div.innerHTML = `<span>${name}</span> <button class="icon-btn" style="color:var(--accent)" onclick="deleteStudent(${i})">✕</button>`;
            list.appendChild(div);
        });
    }

    function showInsights() {
        const counts = {};
        connections.forEach(c => { counts[c.from] = (counts[c.from] || 0) + 1; });
        
        let stats = Object.keys(activeCards).map(id => ({
            name: activeCards[id].name, count: counts[id] || 0
        })).sort((a, b) => b.count - a.count);

        const list = document.getElementById('insightList');
        list.innerHTML = '';
        
        if(stats.length === 0 || stats[0].count === 0) {
            list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-secondary);">아직 기록된 배움 나눔이 없습니다.</div>';
        } else {
            const medals = ["🥇", "🥈", "🥉"];
            stats.forEach((s, i) => {
                if(s.count > 0) {
                    const rank = i < 3 ? medals[i] : `<span style="font-size:1.2rem; color:var(--text-secondary)">${i+1}</span>`;
                    list.innerHTML += `<div class="insight-item">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="insight-rank">${rank}</div>
                            <span style="font-size:1.1rem; font-weight:700;">${s.name}</span>
                        </div>
                        <div style="font-weight:700; color:var(--primary); background:rgba(0,102,204,0.1); padding:6px 12px; border-radius:20px;">
                            ${s.count}번 나눔
                        </div>
                    </div>`;
                }
            });
        }
        openModal('insightModal');
    }

    function openModal(id) {
        if(id === 'studentModal') renderEditList();
        document.getElementById(id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    window.onload = init;
</script>
</body>
</html>
