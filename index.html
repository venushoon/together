<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>함께 배움 보드 (Ultimate Edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

<style>
    :root {
        --ink: #1e293b;
        --ink-light: #475569;
        --paper: #f8fafc;
        --surface: #ffffff;
        --navy: #1e3a8a;
        --navy-light: #eff6ff;
        --accent: #e11d48;
        --gold: #d97706;
        --border: #e2e8f0;
        
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
        --shadow-lg: 0 15px 35px rgba(15, 23, 42, 0.1);
        
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 20px;
        --radius-full: 999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: 'Pretendard', 'DM Sans', sans-serif;
        background: var(--paper); color: var(--ink);
    }

    #app { display: flex; height: 100vh; }

    /* ─────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────── */
    #sidebar {
        width: 320px; background: var(--surface); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; z-index: 50; flex-shrink: 0;
        box-shadow: 2px 0 20px rgba(0,0,0,0.02);
    }

    .sidebar-header {
        padding: 24px; border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
    }
    
    .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--navy); margin: 0; letter-spacing: -0.5px; }
    .brand-sub { font-size: 0.75rem; color: var(--ink-light); font-weight: 600; letter-spacing: 1px; }
    
    .icon-btn {
        width: 36px; height: 36px; background: var(--paper); border: none; border-radius: var(--radius-sm);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        color: var(--ink-light); transition: 0.2s;
    }
    .icon-btn:hover { background: var(--border); color: var(--ink); }

    .student-list-container {
        padding: 16px; overflow-y: auto; flex-grow: 1;
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start;
    }
    
    .student-list-container::-webkit-scrollbar { width: 6px; }
    .student-list-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .student-item {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
        padding: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
        display: flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .student-item:hover { border-color: var(--navy); background: var(--navy-light); color: var(--navy); transform: translateY(-1px); }
    .student-item.completed { opacity: 0.4; pointer-events: none; background: var(--paper); border-style: dashed; }
    
    .student-emoji { font-size: 1.1rem; }
    .student-name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-footer { padding: 20px; border-top: 1px solid var(--border); background: #fafafa; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--ink-light); margin-bottom: 8px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--navy); border-radius: var(--radius-full); transition: width 0.4s ease; }

    /* ─────────────────────────────────────────
       MAIN BOARD & TOP BAR
    ───────────────────────────────────────── */
    #board {
        flex-grow: 1; position: relative; overflow: hidden; touch-action: none;
        background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px;
    }

    canvas { position: absolute; top: 0; left: 0; pointer-events: auto; z-index: 1; cursor: crosshair; }

    #top-bar {
        position: absolute; top: 20px; left: 20px; right: 20px;
        display: flex; gap: 16px; z-index: 20; pointer-events: none;
    }

    .goal-widget {
        background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
        padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        display: flex; align-items: center; gap: 12px; pointer-events: auto; flex-grow: 1;
        border: 1px solid rgba(255,255,255,0.5);
    }
    .goal-widget::before { content:''; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px #fef3c7; flex-shrink: 0; }
    .goal-input {
        border: none; background: transparent; font-size: 1.2rem; font-weight: 700; color: var(--ink);
        width: 100%; outline: none; letter-spacing: -0.5px;
    }
    .goal-input::placeholder { color: #94a3b8; font-weight: 500; }

    .timer-widget {
        background: var(--surface); padding: 8px 16px 8px 24px; border-radius: 100px;
        box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 20px;
        pointer-events: auto; border: 1px solid var(--border); flex-shrink: 0;
    }
    .time-display {
        font-family: 'DM Sans', sans-serif; font-size: 1.8rem; font-weight: 700;
        color: var(--ink); letter-spacing: -1px; font-variant-numeric: tabular-nums;
        cursor: pointer; transition: color 0.2s;
    }
    .time-display:hover { color: var(--navy); }
    .time-display.warning { color: var(--accent); animation: pulse 1s infinite; }
    
    .timer-controls { display: flex; gap: 6px; align-items: center; }
    
    .timer-btn {
        width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--paper);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        color: var(--ink-light); transition: all 0.2s; font-weight: bold; font-size: 0.9rem;
    }
    .timer-btn:hover { background: var(--border); color: var(--ink); }
    
    .play-pause-btn { width: 44px; height: 44px; background: var(--navy); color: white; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.3); }
    .play-pause-btn:hover { background: #172554; transform: scale(1.05); }
    .play-pause-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ─────────────────────────────────────────
       BOTTOM TOOLBAR
    ───────────────────────────────────────── */
    .bottom-toolbar {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
        padding: 8px; border-radius: 100px; box-shadow: var(--shadow-lg);
        display: flex; gap: 4px; z-index: 20; border: 1px solid var(--border);
        max-width: 95%; overflow-x: auto; white-space: nowrap;
        scrollbar-width: none;
    }
    .bottom-toolbar::-webkit-scrollbar { display: none; }

    .tool-btn {
        padding: 12px 24px; border: none; border-radius: 100px; font-weight: 700; font-size: 0.95rem;
        cursor: pointer; display: flex; align-items: center; gap: 8px; background: transparent;
        color: var(--ink-light); transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0;
    }
    .tool-btn:hover { background: var(--paper); color: var(--ink); }
    .tool-btn.active { background: var(--navy); color: white; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25); }
    .tool-btn.danger { color: var(--accent); }
    .tool-btn.danger:hover { background: #fff1f2; }
    .divider { width: 1px; height: 24px; background: var(--border); margin: auto 4px; flex-shrink: 0; }

    @media (max-width: 768px) {
        .bottom-toolbar { padding: 6px; justify-content: flex-start; }
        .tool-btn { padding: 10px 16px; font-size: 0.85rem; }
    }

    /* ─────────────────────────────────────────
       STUDENT CARDS
    ───────────────────────────────────────── */
    .board-card {
        position: absolute; width: 100px; background: var(--surface); border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg); display: flex; flex-direction: column; align-items: center;
        padding: 16px 10px; gap: 8px; user-select: none; z-index: 5; border: 2px solid transparent;
        transform-origin: center; animation: cardPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .board-card::before {
        content: ''; position: absolute; top: -2px; left: 20px; right: 20px; height: 4px;
        border-radius: 0 0 4px 4px; background: var(--card-color, var(--navy)); transition: background 0.2s;
    }

    .card-emoji {
        width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 1.8rem; background: var(--card-bg-color, var(--paper)); flex-shrink: 0;
    }
    .card-name { font-weight: 700; color: var(--ink); font-size: 0.9rem; text-align: center; }
    
    .card-badge {
        position: absolute; top: -8px; right: -8px; background: var(--card-color, var(--navy)); color: white;
        font-size: 0.75rem; font-weight: 800; min-width: 24px; height: 24px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; border: 2px solid white;
        opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-badge.visible { opacity: 1; transform: scale(1); }

    body[data-mode="move"] .board-card { cursor: grab; }
    body[data-mode="move"] .board-card:active { cursor: grabbing; z-index: 100; transform: scale(1.05); }
    body[data-mode="connect"] .board-card { cursor: crosshair; }
    body[data-mode="connect"] .board-card:hover { border-color: var(--card-color, var(--navy)); box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }

    @keyframes cardPop { 0% { transform: scale(0.5) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* 모달 */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: 0.2s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-content {
        background: var(--surface); padding: 32px; border-radius: 24px; box-shadow: var(--shadow-lg);
        width: 440px; max-width: 90%; transform: scale(0.95); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .modal-content { transform: scale(1); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .modal-title { font-size: 1.4rem; font-weight: 800; margin: 0; color: var(--ink); }
    .modal-sub { font-size: 0.85rem; color: var(--ink-light); margin-top: 4px; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    .modal-input { flex-grow: 1; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; outline: none; }
    .modal-input:focus { border-color: var(--navy); }
    .btn-primary { background: var(--navy); color: white; border: none; padding: 0 20px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
    
    .edit-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .edit-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--paper); border-radius: var(--radius-md); font-weight: 600; }

    /* 인사이트 리스트 */
    .insight-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .insight-row:last-child { border-bottom: none; }
    .insight-medal { font-size: 1.5rem; width: 32px; text-align: center; flex-shrink: 0; }
    .insight-info { flex-grow: 1; }
    .insight-name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .insight-bar-bg { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
    .insight-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .insight-count { font-weight: 800; font-size: 0.9rem; color: var(--navy); background: var(--navy-light); padding: 4px 12px; border-radius: 100px; }


    /* 사이드바 접기 */
    #sidebar { transition: margin-left 0.25s ease; }
    #sidebar.collapsed { margin-left: -320px; }
    #expandSidebarBtn {
        position: absolute; top: 104px; left: 20px; z-index: 30; display: none;
        background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
        padding: 10px 18px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
        box-shadow: var(--shadow-md); color: var(--ink);
    }
    #expandSidebarBtn.visible { display: block; }
    .board-card { touch-action: none; }
</style>
</head>
<body data-mode="move">

<div id="app">
    <aside id="sidebar">
        <div class="sidebar-header">
            <div>
                <h1 class="brand-title">Learner Board</h1>
                <span class="brand-sub">배움 나눔 보드</span>
            </div>
            <div style="display:flex; gap:6px;">
            <button class="icon-btn" onclick="toggleSidebar()" title="사이드바 접기">◀</button>
            <button class="icon-btn" onclick="openModal('studentModal')" title="명단 설정">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            </div>
        </div>
        
        <div class="student-list-container" id="studentList"></div>
        
        <div class="sidebar-footer">
            <div class="progress-text">
                <span>보드 참여율</span>
                <span id="progressText" style="color:var(--navy)">0 / 0명</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
        </div>
    </aside>

    <main id="board">
        <button id="expandSidebarBtn" onclick="toggleSidebar()">☰ 명단 열기</button>
        <div id="top-bar">
            <div class="goal-widget">
                <input type="text" id="goalInput" class="goal-input" placeholder="오늘의 배움 목표를 입력하세요">
            </div>
            
            <div class="timer-widget">
                <div class="time-display" id="timeDisplay" onclick="setTimeManually()" title="클릭하여 시간 설정">20:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" onclick="adjustTime(-1)">-1</button>
                    <button class="timer-btn play-pause-btn" id="playBtn" onclick="toggleTimer()">
                        <svg id="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <button class="timer-btn" onclick="resetTimer()" title="초기화">↺</button>
                    <button class="timer-btn" onclick="adjustTime(1)">+1</button>
                </div>
            </div>
        </div>

        <div class="bottom-toolbar">
            <button class="tool-btn active" id="btnMoveMode" onclick="setMode('move')">🖐️ 이동</button>
            <button class="tool-btn" id="btnConnectMode" onclick="setMode('connect')">↗️ 배움 릴레이</button>
            <div class="divider"></div>
            <button class="tool-btn" onclick="showInsights()">📊 인사이트</button>
            <button class="tool-btn" onclick="exportPNG()">🖼️ PNG 저장</button>
            <button class="tool-btn" onclick="exportCSV()">📄 CSV</button>
            <div class="divider"></div>
            <button class="tool-btn danger" onclick="clearLines()">🧹 선 지우기</button>
            <button class="tool-btn danger" onclick="resetBoard()">🗑️ 초기화</button>
        </div>

        <canvas id="canvas"></canvas>
    </main>
</div>

<div class="modal-overlay" id="studentModal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">학생 명단 관리</h3>
                <p class="modal-sub">이름을 입력하여 추가하거나 ✕를 눌러 삭제하세요.</p>
            </div>
            <button class="icon-btn" onclick="closeModal('studentModal')">✕</button>
        </div>
        <div class="input-group">
            <input type="text" id="newStudentName" class="modal-input" placeholder="이름 입력 후 엔터" onkeypress="if(event.key==='Enter') addStudent()">
            <button class="btn-primary" onclick="addStudent()">추가</button>
        </div>
        <div class="edit-list" id="editStudentList"></div>
    </div>
</div>

<div class="modal-overlay" id="insightModal">
    <div class="modal-content" style="width: 500px;">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">오늘의 배움 나눔 왕 👑</h3>
                <p class="modal-sub">친구들에게 나눔을 실천한 멋진 학생들입니다.</p>
            </div>
            <button class="icon-btn" onclick="closeModal('insightModal')">✕</button>
        </div>
        <div id="insightList" class="edit-list" style="max-height: 400px; overflow-x:hidden;"></div>
    </div>
</div>

<script>
    /* ==========================================
       사운드 (웹 오디오 API)
    ========================================== */
    let audioCtx;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'connect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'alert') {
                osc.type = 'square';
                [0, 0.2, 0.4].forEach((t, i) => { osc.frequency.setValueAtTime([400, 600, 400][i], now + t); });
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
            }
        } catch(e) {}
    }

    /* ==========================================
       데이터 및 상태 (스키마 v2)
       - students: { id, name, emoji, color } 객체 배열 (인덱스가 아닌 id로 식별)
       - cards: { [studentId]: {x, y} } — 보드에 올라간 카드와 위치
       - connections: { from, to } — studentId 기준 배움 화살표
       - 전체 상태를 단일 blob(together_v2_state)으로 자동 저장/복원
    ========================================== */
    const EMOJIS = ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐢","🐸","🐵","🐧","🐥","🐬","🦔","🦉"];
    const COLORS = [
        "#ef4444","#3b82f6","#22c55e","#f97316","#8b5cf6","#14b8a6","#ec4899","#eab308","#06b6d4","#6366f1",
        "#84cc16","#f43f5e","#10b981","#a855f7","#f59e0b","#0ea5e9","#d946ef","#16a34a","#dc2626","#4f46e5"
    ];
    const defaultNames = ["김민준","이서연","박지우","최예준","정윤아","강도윤","임하은","한주원","송지현","오민수","유진아","전진우","윤지호","박수아","이도현","김태희","정우진","최다은","강민지","조윤호","황서진","백도윤","권시연","송건우"];

    const _isArr = v => Array.isArray(v);
    const _isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
    function safeParse(key, fallback, validate) {
        try {
            const raw = localStorage.getItem(key);
            if (raw === null) return fallback;
            const v = JSON.parse(raw);
            if (validate && !validate(v)) throw new Error('invalid');
            return v;
        } catch(e) {
            try { const raw = localStorage.getItem(key); if (raw !== null) localStorage.setItem(key + '_corrupt_backup', raw); } catch(_) {}
            return fallback;
        }
    }
    function escapeHtml(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function normalizeName(v) { return String(v ?? '').trim().replace(/\s+/g, ' '); }

    function defaultStudents() {
        return defaultNames.map((name, i) => ({ id: 's' + i, name, emoji: EMOJIS[i % EMOJIS.length], color: COLORS[i % COLORS.length] }));
    }
    function migrateV1() {
        const v1 = safeParse('lb_students_pro4', null, _isArr);
        if (!v1) return null;
        const names = v1.map(normalizeName).filter(Boolean);
        if (!names.length) return null;
        const studs = names.map((name, i) => ({ id: 's_mig_' + i, name, emoji: EMOJIS[i % EMOJIS.length], color: COLORS[i % COLORS.length] }));
        let goal = '';
        try { goal = localStorage.getItem('lb_goal_pro4') || ''; } catch(e) {}
        return { schemaVersion: 2, students: studs, goal, cards: {}, connections: [], studentSeq: studs.length };
    }

    let _state = safeParse('together_v2_state', null, v => v === null || (_isObj(v) && v.schemaVersion === 2));
    if (!_state) _state = migrateV1();
    if (!_state) _state = { schemaVersion: 2, students: defaultStudents(), goal: '', cards: {}, connections: [], studentSeq: defaultNames.length };

    let students    = _isArr(_state.students) ? _state.students.filter(s => _isObj(s) && s.id && s.name) : defaultStudents();
    if (!students.length) students = defaultStudents();
    let goalText    = typeof _state.goal === 'string' ? _state.goal : '';
    let cards       = _isObj(_state.cards) ? _state.cards : {};              // studentId -> {x,y}
    let connections = _isArr(_state.connections) ? _state.connections.filter(c => _isObj(c) && c.from && c.to) : [];
    let studentSeq  = (typeof _state.studentSeq === 'number' && !isNaN(_state.studentSeq)) ? _state.studentSeq : students.length;
    // 존재하지 않는 학생을 가리키는 카드/연결 정리
    const _validIds = new Set(students.map(s => s.id));
    Object.keys(cards).forEach(id => { if (!_validIds.has(id)) delete cards[id]; });
    connections = connections.filter(c => _validIds.has(c.from) && _validIds.has(c.to) && c.from !== c.to);

    let _saveAlertShown = false;
    function saveState() {
        try {
            localStorage.setItem('together_v2_state', JSON.stringify({ schemaVersion: 2, students, goal: goalText, cards, connections, studentSeq }));
        } catch(e) {
            if (!_saveAlertShown) { _saveAlertShown = true; alert('저장에 실패했습니다. 브라우저 저장 공간이 부족할 수 있습니다.'); }
        }
    }
    function studentById(id) { return students.find(s => s.id === id) || null; }
    function genStudentId() { return 's_' + Date.now().toString(36) + '_' + (studentSeq++).toString(36) + Math.random().toString(36).slice(2, 6); }

    let mode = 'move';
    let isDrawing = false, startCardId = null, mousePos = { x: 0, y: 0 };
    let justConnected = false;

    const board = document.getElementById('board');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    /* ==========================================
       초기화
    ========================================== */
    function init() {
        const goalInput = document.getElementById('goalInput');
        goalInput.value = goalText;
        goalInput.addEventListener('input', e => { goalText = e.target.value; saveState(); });

        renderSidebar();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 보드 복원: 저장된 카드 위치와 화살표 재현
        Object.keys(cards).forEach(sid => createCardEl(sid));
        saveState(); // v1 마이그레이션/기본값이면 v2 blob으로 확정 저장
        updateBadges();
        updateProgress();
        drawCanvas();

        board.addEventListener('pointermove', handlePointerMove);
        board.addEventListener('pointerup', handlePointerUp);
        board.addEventListener('pointercancel', handlePointerUp);
        board.addEventListener('click', handleBoardClick);

        // 모달 UX: 배경 클릭 / ESC 닫기
        document.querySelectorAll('.modal-overlay').forEach(ov => {
            ov.addEventListener('click', e => { if (e.target === ov) closeModal(ov.id); });
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(ov => closeModal(ov.id));
        });

        document.body.addEventListener('click', () => { try{ if(audioCtx) audioCtx.resume(); }catch(e){} }, {once: true});
    }

    function clampCardPos(el, x, y) {
        const maxX = Math.max(0, board.clientWidth - el.offsetWidth);
        const maxY = Math.max(0, board.clientHeight - el.offsetHeight);
        return { x: Math.min(Math.max(0, x), maxX), y: Math.min(Math.max(0, y), maxY) };
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(board.clientWidth * dpr);
        canvas.height = Math.round(board.clientHeight * dpr);
        canvas.style.width = board.clientWidth + 'px';
        canvas.style.height = board.clientHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // 화면이 줄면 화면 밖에 있는 카드를 안으로 끌어옴
        Object.keys(cards).forEach(sid => {
            const el = document.getElementById('card-' + sid);
            if (!el) return;
            const p = clampCardPos(el, cards[sid].x, cards[sid].y);
            cards[sid] = p; el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
        });
        drawCanvas();
    }

    /* ==========================================
       사이드바
    ========================================== */
    function renderSidebar() {
        const list = document.getElementById('studentList');
        list.innerHTML = '';
        students.forEach(st => {
            const div = document.createElement('div');
            div.className = 'student-item' + (cards[st.id] ? ' completed' : '');
            div.id = 'sidebar-' + st.id;
            div.innerHTML = `<span class="student-emoji">${escapeHtml(st.emoji)}</span><span class="student-name">${escapeHtml(st.name)}</span>`;
            div.onclick = () => addCardToBoard(st.id);
            list.appendChild(div);
        });
        updateProgress();
    }

    function updateProgress() {
        const total = students.length; const placed = Object.keys(cards).length;
        const pct = total ? Math.round((placed / total) * 100) : 0;
        document.getElementById('progressText').textContent = `${placed} / ${total}명`;
        document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('collapsed');
        document.getElementById('expandSidebarBtn').classList.toggle('visible', sb.classList.contains('collapsed'));
        setTimeout(resizeCanvas, 260);
        setTimeout(resizeCanvas, 30);
    }

    /* ==========================================
       카드 (생성 & 드래그 — Pointer Events 통합)
    ========================================== */
    function createCardEl(sid) {
        const st = studentById(sid); if (!st || !cards[sid]) return null;
        const card = document.createElement('div');
        card.className = 'board-card';
        card.id = 'card-' + sid;
        card.dataset.studentId = sid;
        card.style.setProperty('--card-color', st.color);
        card.style.setProperty('--card-bg-color', st.color + '15');
        card.innerHTML = `
            <div class="card-emoji">${escapeHtml(st.emoji)}</div>
            <div class="card-name">${escapeHtml(st.name)}</div>
            <div class="card-badge" id="badge-${sid}">0</div>
        `;
        board.appendChild(card);
        const p = clampCardPos(card, cards[sid].x, cards[sid].y);
        cards[sid] = p;
        card.style.left = p.x + 'px'; card.style.top = p.y + 'px';
        card.title = '우클릭 또는 더블클릭(이동 모드)으로 보드에서 내리기';
        card.addEventListener('pointerdown', e => handleCardPointerDown(e, sid));
        card.addEventListener('contextmenu', e => { e.preventDefault(); removeCardFromBoardUI(sid); });
        card.addEventListener('dblclick', () => { if (mode === 'move') removeCardFromBoardUI(sid); });
        return card;
    }

    function addCardToBoard(sid) {
        if (cards[sid]) return; // 이미 보드에 있으면 중복 생성 불가 (id 기준)
        playSound('pop');
        cards[sid] = {
            x: (board.clientWidth / 2) - 50 + (Math.random() * 80 - 40),
            y: (board.clientHeight / 2) - 60 + (Math.random() * 80 - 40)
        };
        createCardEl(sid);
        const sb = document.getElementById('sidebar-' + sid);
        if (sb) sb.classList.add('completed');
        saveState(); updateProgress(); drawCanvas();
    }

    function removeCardFromBoard(sid) {
        const el = document.getElementById('card-' + sid);
        if (el) el.remove();
        delete cards[sid];
        connections = connections.filter(c => c.from !== sid && c.to !== sid);
        const sb = document.getElementById('sidebar-' + sid);
        if (sb) sb.classList.remove('completed');
    }

    function removeCardFromBoardUI(sid) {
        if (!cards[sid]) return;
        removeCardFromBoard(sid);
        saveState(); updateBadges(); updateProgress(); drawCanvas();
    }

    function handleCardPointerDown(e, sid) {
        if (e.button !== undefined && e.button !== 0) return; // 우클릭/가운데 클릭은 내리기 전용
        const el = document.getElementById('card-' + sid);
        if (!el) return;
        if (mode === 'move') {
            e.preventDefault();
            const sx = e.clientX, sy = e.clientY;
            const ox = el.offsetLeft, oy = el.offsetTop;
            let moved = false;
            function onMove(ev) {
                const p = clampCardPos(el, ox + ev.clientX - sx, oy + ev.clientY - sy);
                if (p.x !== ox || p.y !== oy) moved = true;
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                cards[sid] = p;
                drawCanvas();
            }
            function onUp() {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                document.removeEventListener('pointercancel', onUp);
                if (moved) suppressBoardClick();
                saveState();
            }
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
            document.addEventListener('pointercancel', onUp);
        } else if (mode === 'connect') {
            e.preventDefault(); e.stopPropagation();
            isDrawing = true; startCardId = sid; updatePointerPos(e);
            drawCanvas();
        }
    }

    function handlePointerMove(e) { if (isDrawing) { e.preventDefault(); updatePointerPos(e); drawCanvas(); } }

    let _suppressTimer = null;
    // 카드 제스처(연결 그리기·드래그)가 끝난 직후 발생하는 click 한 번을 무시한다.
    // 연결 성공/중복/취소, 드래그 종료 위치와 무관하게 화살표 삭제 확인창이 뜨는 것을 방지.
    function suppressBoardClick() {
        justConnected = true;
        if (_suppressTimer) clearTimeout(_suppressTimer);
        _suppressTimer = setTimeout(() => { justConnected = false; }, 250);
    }

    function handlePointerUp(e) {
        if (!isDrawing) return;
        isDrawing = false;
        suppressBoardClick();
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const tc = target ? target.closest('.board-card') : null;
        if (tc && tc.dataset.studentId && tc.dataset.studentId !== startCardId) {
            const toId = tc.dataset.studentId;
            if (!connections.find(c => c.from === startCardId && c.to === toId)) {
                connections.push({ from: startCardId, to: toId });
                playSound('connect');
                updateBadges(); saveState();
            }
        }
        startCardId = null;
        drawCanvas();
    }

    function updatePointerPos(e) {
        const r = board.getBoundingClientRect();
        mousePos.x = e.clientX - r.left;
        mousePos.y = e.clientY - r.top;
    }

    /* ==========================================
       배움 화살표 개별 삭제 (Click Event)
    ========================================== */
    function handleBoardClick(e) {
        if (justConnected) return;
        if (e.target.closest('.board-card')) return;
        const r = board.getBoundingClientRect();
        const mx = e.clientX - r.left;
        const my = e.clientY - r.top;
        let clickedIdx = -1;
        for (let i = 0; i < connections.length; i++) {
            const p1 = getCenter(connections[i].from);
            const p2 = getCenter(connections[i].to);
            if (p1 && p2) {
                const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 1) continue;
                const offset = Math.min(dist * 0.25, 100);
                const cp1x = p1.x + dx/2 - dy/dist * offset, cp1y = p1.y + dy/2 + dx/dist * offset;
                let hit = false;
                for (let t = 0; t <= 1; t += 0.05) {
                    const x = (1-t)*(1-t)*p1.x + 2*(1-t)*t*cp1x + t*t*p2.x;
                    const y = (1-t)*(1-t)*p1.y + 2*(1-t)*t*cp1y + t*t*p2.y;
                    if (Math.sqrt((x-mx)**2 + (y-my)**2) < 20) { hit = true; break; }
                }
                if (hit) { clickedIdx = i; break; }
            }
        }
        if (clickedIdx !== -1) {
            if(confirm("이 배움 연결(화살표)을 삭제할까요?")) {
                connections.splice(clickedIdx, 1);
                playSound('pop');
                updateBadges(); saveState(); drawCanvas();
            }
        }
    }

    function updateBadges() {
        Object.keys(cards).forEach(sid => {
            const badge = document.getElementById('badge-' + sid);
            if (!badge) return;
            const count = connections.filter(c => c.from === sid).length; // 나눔을 준 횟수
            badge.textContent = count;
            const st = studentById(sid);
            if (st) badge.style.backgroundColor = st.color;
            if (count > 0) badge.classList.add('visible');
            else badge.classList.remove('visible');
        });
    }

    /* ==========================================
       모드 및 보드 리셋
    ========================================== */
    function setMode(m) {
        mode = m; document.body.setAttribute('data-mode', mode);
        document.getElementById('btnMoveMode').classList.toggle('active', mode === 'move');
        document.getElementById('btnConnectMode').classList.toggle('active', mode === 'connect');
    }
    function clearLines() { connections = []; updateBadges(); saveState(); drawCanvas(); }
    function resetBoard() {
        if (!confirm('보드를 완전히 초기화하시겠습니까?')) return;
        Object.keys(cards).forEach(sid => { const el = document.getElementById('card-' + sid); if (el) el.remove(); });
        cards = {}; connections = [];
        document.querySelectorAll('.student-item').forEach(el => el.classList.remove('completed'));
        saveState(); updateProgress(); drawCanvas();
    }

    /* ==========================================
       캔버스 (필요할 때만 다시 그림 — 상시 rAF 루프 없음)
    ========================================== */
    function getCenter(sid) {
        const el = document.getElementById('card-' + sid); if(!el) return null;
        return { x: el.offsetLeft + el.offsetWidth/2, y: el.offsetTop + el.offsetHeight/2 };
    }

    function drawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        connections.forEach(c => {
            const p1 = getCenter(c.from), p2 = getCenter(c.to);
            const st = studentById(c.from);
            if (p1 && p2 && st) drawCurve(ctx, p1, p2, false, st.color);
        });
        if (isDrawing && startCardId) {
            const p1 = getCenter(startCardId);
            const st = studentById(startCardId);
            if (p1 && st) drawCurve(ctx, p1, mousePos, true, st.color);
        }
    }

    function drawCurve(c2d, p1, p2, isTemp, color) {
        const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 1) return;
        const offset = Math.min(dist * 0.25, 100);
        const cp1x = p1.x + dx/2 - dy/dist * offset, cp1y = p1.y + dy/2 + dx/dist * offset;
        c2d.beginPath(); c2d.moveTo(p1.x, p1.y); c2d.quadraticCurveTo(cp1x, cp1y, p2.x, p2.y);
        if (isTemp) {
            c2d.strokeStyle = color; c2d.globalAlpha = 0.4;
            c2d.lineWidth = 3; c2d.setLineDash([8, 8]); c2d.stroke();
            c2d.globalAlpha = 1.0;
        } else {
            c2d.strokeStyle = color; c2d.lineWidth = 3.5;
            c2d.setLineDash([]); c2d.lineCap = 'round';
            c2d.stroke();
            const t = 0.55;
            const ax = (1-t)*(1-t)*p1.x + 2*(1-t)*t*cp1x + t*t*p2.x;
            const ay = (1-t)*(1-t)*p1.y + 2*(1-t)*t*cp1y + t*t*p2.y;
            const tx = 2*(1-t)*(cp1x-p1.x) + 2*t*(p2.x-cp1x), ty = 2*(1-t)*(cp1y-p1.y) + 2*t*(p2.y-cp1y);
            const angle = Math.atan2(ty, tx);
            const arrowSize = 16;
            c2d.beginPath(); c2d.setLineDash([]); c2d.moveTo(ax, ay);
            c2d.lineTo(ax - arrowSize*Math.cos(angle-Math.PI/6), ay - arrowSize*Math.sin(angle-Math.PI/6));
            c2d.lineTo(ax - arrowSize*Math.cos(angle+Math.PI/6), ay - arrowSize*Math.sin(angle+Math.PI/6));
            c2d.closePath(); c2d.fillStyle = color; c2d.fill();
        }
        c2d.setLineDash([]);
    }

    /* ==========================================
       내보내기 (PNG / CSV)
    ========================================== */
    function downloadBlob(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    function dateStamp() { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

    function insightStats() {
        return students.map(st => ({
            id: st.id, name: st.name, color: st.color,
            gave: connections.filter(c => c.from === st.id).length,
            received: connections.filter(c => c.to === st.id).length,
            placed: !!cards[st.id]
        })).sort((a, b) => b.gave - a.gave || b.received - a.received);
    }

    function exportCSV() {
        const rows = [['이름', '나눔 준 횟수', '나눔 받은 횟수', '보드 참여']];
        insightStats().forEach(s => rows.push([s.name, s.gave, s.received, s.placed ? '참여' : '미참여']));
        const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `배움보드_${dateStamp()}.csv`);
    }

    function exportPNG() {
        if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h) { this.rect(x, y, w, h); return this; };
        }
        const W = board.clientWidth, H = board.clientHeight;
        const SCALE = 2; // 고해상도 저장 (좌표는 CSS 픽셀 기준 그대로)
        const off = document.createElement('canvas'); off.width = W * SCALE; off.height = H * SCALE;
        const o = off.getContext('2d');
        o.setTransform(SCALE, 0, 0, SCALE, 0, 0);
        o.fillStyle = '#f8fafc'; o.fillRect(0, 0, W, H);
        // 도트 배경
        o.fillStyle = '#cbd5e1';
        for (let x = 12; x < W; x += 24) for (let y = 12; y < H; y += 24) { o.beginPath(); o.arc(x, y, 1.5, 0, Math.PI * 2); o.fill(); }
        // 목표
        if (goalText) {
            o.fillStyle = '#1e293b'; o.font = '700 20px Pretendard, sans-serif'; o.textAlign = 'left';
            o.fillText('🎯 ' + goalText, 24, 40);
        }
        // 화살표 (카드 중심 좌표는 DOM 기준)
        connections.forEach(c => {
            const p1 = getCenter(c.from), p2 = getCenter(c.to);
            const st = studentById(c.from);
            if (p1 && p2 && st) drawCurve(o, p1, p2, false, st.color);
        });
        // 카드
        Object.keys(cards).forEach(sid => {
            const el = document.getElementById('card-' + sid); const st = studentById(sid);
            if (!el || !st) return;
            const x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
            o.save();
            o.shadowColor = 'rgba(15,23,42,0.12)'; o.shadowBlur = 18; o.shadowOffsetY = 6;
            o.fillStyle = '#ffffff';
            o.beginPath(); o.roundRect(x, y, w, h, 20); o.fill();
            o.restore();
            o.fillStyle = st.color;
            o.beginPath(); o.roundRect(x + 20, y, w - 40, 4, 2); o.fill();
            // 이모지 원
            o.fillStyle = st.color + '26';
            o.beginPath(); o.arc(x + w/2, y + 41, 25, 0, Math.PI * 2); o.fill();
            o.font = '28px sans-serif'; o.textAlign = 'center'; o.textBaseline = 'middle';
            o.fillText(st.emoji, x + w/2, y + 43);
            o.fillStyle = '#1e293b'; o.font = '700 14px Pretendard, sans-serif';
            o.fillText(st.name, x + w/2, y + 84, w - 16);
            const gave = connections.filter(c => c.from === sid).length;
            if (gave > 0) {
                o.fillStyle = st.color;
                o.beginPath(); o.arc(x + w - 2, y + 2, 12, 0, Math.PI * 2); o.fill();
                o.fillStyle = '#fff'; o.font = '800 12px sans-serif';
                o.fillText(String(gave), x + w - 2, y + 3);
            }
            o.textBaseline = 'alphabetic';
        });
        off.toBlob(blob => { if (blob) downloadBlob(blob, `배움보드_${dateStamp()}.png`); }, 'image/png');
    }

    /* ==========================================
       타이머 시스템 (reset은 마지막으로 설정한 시간으로)
    ========================================== */
    let totalSeconds = 20 * 60;
    let timeRemaining = totalSeconds;
    let timerInterval = null, isPlaying = false;

    function updateTimerDisplay() {
        const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
        const s = String(timeRemaining % 60).padStart(2, '0');
        const display = document.getElementById('timeDisplay');
        display.textContent = `${m}:${s}`;
        display.classList.toggle('warning', timeRemaining <= 60 && timeRemaining > 0);
    }

    function setTimeManually() {
        if(isPlaying) toggleTimer();
        const input = prompt("설정할 시간을 분 단위로 입력하세요 (예: 15)", Math.floor(timeRemaining / 60));
        if (input && !isNaN(input) && parseInt(input) > 0) {
            totalSeconds = timeRemaining = parseInt(input) * 60;
            updateTimerDisplay();
        }
    }

    function adjustTime(min) {
        timeRemaining = Math.max(0, timeRemaining + min * 60);
        updateTimerDisplay();
    }

    function toggleTimer() {
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        if (isPlaying) {
            clearInterval(timerInterval);
            iconPlay.style.display = 'block'; iconPause.style.display = 'none';
        } else {
            if (timeRemaining <= 0) return;
            timerInterval = setInterval(() => {
                timeRemaining--; updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval); isPlaying = false;
                    iconPlay.style.display = 'block'; iconPause.style.display = 'none';
                    playSound('alert');
                    setTimeout(() => alert("⏰ 시간이 종료되었습니다!"), 100);
                }
            }, 1000);
            iconPlay.style.display = 'none'; iconPause.style.display = 'block';
        }
        isPlaying = !isPlaying;
    }

    function resetTimer() {
        clearInterval(timerInterval); isPlaying = false;
        document.getElementById('icon-play').style.display = 'block';
        document.getElementById('icon-pause').style.display = 'none';
        timeRemaining = totalSeconds;
        updateTimerDisplay();
    }

    /* ==========================================
       모달 & 인사이트 & 명단 관리
    ========================================== */
    function openModal(id) {
        if (id === 'studentModal') renderEditList();
        const el = document.getElementById(id);
        el.style.display = 'flex';
        requestAnimationFrame(() => el.classList.add('active'));
    }

    function closeModal(id) {
        const el = document.getElementById(id);
        el.classList.remove('active');
        setTimeout(() => { if (!el.classList.contains('active')) el.style.display = 'none'; }, 300);
    }

    function renderEditList() {
        const list = document.getElementById('editStudentList');
        list.innerHTML = '';
        students.forEach(st => {
            const row = document.createElement('div');
            row.className = 'edit-item';
            const label = document.createElement('span');
            label.textContent = `${st.emoji} ${st.name}`;
            const btn = document.createElement('button');
            btn.className = 'icon-btn';
            btn.style.cssText = 'color:var(--accent); width:28px; height:28px;';
            btn.textContent = '✕';
            btn.title = '삭제';
            btn.onclick = () => deleteStudent(st.id);
            row.appendChild(label); row.appendChild(btn);
            list.appendChild(row);
        });
    }

    function saveStudents() { saveState(); renderSidebar(); renderEditList(); }

    function addStudent() {
        const inp = document.getElementById('newStudentName');
        const name = normalizeName(inp.value);
        if (!name) return;
        if (students.some(s => s.name === name)) {
            if (!confirm(`'${name}' 학생이 이미 명단에 있습니다. 동명이인으로 추가할까요?`)) return;
        }
        const seq = studentSeq;
        students.push({ id: genStudentId(), name, emoji: EMOJIS[seq % EMOJIS.length], color: COLORS[seq % COLORS.length] });
        inp.value = '';
        saveStudents();
    }

    function deleteStudent(id) {
        const st = studentById(id); if (!st) return;
        if (cards[id] && !confirm(`'${st.name}' 학생은 지금 보드에 올라가 있습니다. 삭제하면 카드와 연결된 화살표도 함께 지워집니다. 계속할까요?`)) return;
        students = students.filter(s => s.id !== id);
        if (cards[id]) removeCardFromBoard(id);
        saveState(); renderSidebar(); renderEditList(); updateBadges(); updateProgress(); drawCanvas();
    }

    function showInsights() {
        const stats = insightStats().filter(s => s.gave > 0);
        const list = document.getElementById('insightList');
        if (!stats.length) {
            list.innerHTML = '<div style="text-align:center; padding:40px; color:var(--ink-light);">아직 나누어진 배움이 없습니다.</div>';
        } else {
            const max = stats[0].gave;
            const medals = ['🥇','🥈','🥉'];
            list.innerHTML = stats.map((s, i) => `
                <div class="insight-row">
                    <div class="insight-medal">${i < 3 ? medals[i] : `<span style="font-size:1.1rem; color:var(--ink-light)">${i+1}</span>`}</div>
                    <div class="insight-info">
                        <div class="insight-name">${escapeHtml(s.name)}</div>
                        <div class="insight-bar-bg"><div class="insight-bar-fill" style="width:${(s.gave/max)*100}%; background:${escapeHtml(s.color)};"></div></div>
                    </div>
                    <div class="insight-count">${s.gave}회</div>
                </div>
            `).join('');
        }
        openModal('insightModal');
    }

    window.onload = init;
</script>
</body>
</html>
