<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인텔리전트 함께 배움</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-color: #f4f7f6;
            --primary: #4a90e2;
            --accent: #ff6b6b;
            --success: #2ed573;
            --text-main: #2f3542;
            --card-bg: #ffffff;
            --board-bg: #ffffff;
            --shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
        }

        /* 메인 레이아웃 */
        #app { display: flex; height: 100vh; }

        /* --- 사이드바 (학생 명단) --- */
        #sidebar {
            width: 260px; background: var(--card-bg); border-right: 1px solid #eee;
            display: flex; flex-direction: column; box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px; text-align: center; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: #333; }
        .btn-icon { background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s; }
        .btn-icon:hover { transform: scale(1.1); }

        .student-list { padding: 15px; overflow-y: auto; flex-grow: 1; }
        
        .student-item {
            background: #f8f9fa; border: 2px solid #edf2f7; border-radius: 12px;
            padding: 12px; margin-bottom: 10px; cursor: pointer; text-align: center;
            font-weight: 600; transition: all 0.2s;
        }
        .student-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        .student-item.completed { opacity: 0.4; pointer-events: none; }

        /* --- 상단 컨트롤 패널 (타이틀, 목표, 타이머) --- */
        #top-panel {
            position: absolute; top: 20px; left: 280px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 20;
            pointer-events: none;
        }

        .title-box {
            background: var(--card-bg); padding: 15px 25px; border-radius: 20px;
            box-shadow: var(--shadow); pointer-events: auto; display: flex; flex-direction: column; gap: 8px;
            border-left: 5px solid var(--primary);
        }

        .title-box h1 { margin: 0; font-size: 1.6rem; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
        
        .goal-input {
            border: none; background: #fff5e6; padding: 8px 12px; border-radius: 8px;
            font-size: 1.1rem; font-weight: 600; color: #e67e22; width: 300px;
            outline: none; transition: background 0.2s; cursor: text;
        }
        .goal-input:focus { background: #ffeaa7; }

        /* 타이머 */
        .timer-box {
            background: var(--card-bg); padding: 15px 25px; border-radius: 20px;
            box-shadow: var(--shadow); pointer-events: auto; text-align: center;
            border-top: 5px solid var(--accent); display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .timer-display { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-main); }
        .timer-controls { display: flex; gap: 8px; }
        .timer-btn {
            padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; background: #f1f2f6; transition: 0.2s;
        }
        .timer-btn.play { background: var(--success); color: white; }
        .timer-btn.pause { background: #ffa502; color: white; }
        .timer-btn:hover { filter: brightness(0.9); }

        /* --- 플로팅 도구 모음 --- */
        .tools-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); padding: 10px; border-radius: 30px; box-shadow: var(--shadow);
            display: flex; gap: 10px; z-index: 20;
        }

        .tool-btn {
            padding: 12px 20px; border: 2px solid transparent; border-radius: 20px;
            font-weight: bold; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 8px;
            background: #f8f9fa; color: #555; transition: all 0.2s;
        }
        .tool-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3); }
        .tool-btn:hover:not(.active) { background: #e9ecef; }
        
        .btn-danger { background: #ffefef; color: var(--accent); }
        .btn-danger:hover { background: var(--accent); color: white; }

        /* --- 메인 보드 & 캔버스 --- */
        #board {
            flex-grow: 1; position: relative; background: var(--board-bg);
            margin: 0; overflow: hidden;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* 학생 카드 (보드 위) */
        .board-card {
            position: absolute; width: 90px; height: 120px; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            user-select: none; z-index: 5; transition: transform 0.1s, border 0.2s;
            border: 3px solid transparent;
        }
        
        .board-card .emoji { font-size: 2.5rem; margin-bottom: 5px; }
        .board-card .name { font-weight: 700; color: var(--text-main); font-size: 1rem; }
        
        /* 모드별 카드 상호작용 스타일 */
        body[data-mode="move"] .board-card { cursor: grab; border-color: #ffd32a; }
        body[data-mode="move"] .board-card:active { cursor: grabbing; transform: scale(1.05); z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        body[data-mode="connect"] .board-card { cursor: crosshair; border-color: var(--primary); }
        body[data-mode="connect"] .board-card:hover { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.2); }

        /* --- 모달 (팝업) 스타일 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 400px; max-width: 90%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title { font-size: 1.4rem; font-weight: bold; margin-top: 0; margin-bottom: 20px; text-align: center; color: var(--text-main); }
        
        /* 명단 관리 모달 전용 */
        .student-edit-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; border-radius: 10px; padding: 10px; }
        .edit-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
        .edit-item:last-child { border-bottom: none; }
        .add-student-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-student-box input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        
        /* 공통 버튼 */
        .btn-full { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-full:hover { background: #357abd; }

        /* 인사이트 리스트 */
        .insight-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f8f9fa; border-radius: 10px; margin-bottom: 10px; }
        .insight-rank { font-weight: 800; color: #f1c40f; font-size: 1.2rem; width: 30px; }
        .insight-score { font-weight: bold; color: var(--primary); }

    </style>
</head>
<body data-mode="move"> <div id="app">
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>🧑‍🏫 학생 명단</h2>
            <button class="btn-icon" onclick="openModal('studentModal')" title="명단 관리">⚙️</button>
        </div>
        <div class="student-list" id="studentList">
            </div>
        <div style="padding: 10px; text-align: center; font-size: 0.8rem; color: #888;">이름을 클릭해 보드에 추가하세요.</div>
    </aside>

    <main id="board">
        <div id="top-panel">
            <div class="title-box">
                <h1>✨ 함께 배움 보드</h1>
                <input type="text" id="goalInput" class="goal-input" value="목표: 수익 12~13쪽 해결하기" placeholder="오늘의 배움 목표를 입력하세요">
            </div>

            <div class="timer-box">
                <div class="timer-display" id="timeDisplay">20:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" onclick="adjustTime(-1)">-1분</button>
                    <button class="timer-btn play" id="playBtn" onclick="toggleTimer()">▶ 시작</button>
                    <button class="timer-btn" onclick="resetTimer()">🔄 리셋</button>
                    <button class="timer-btn" onclick="adjustTime(1)">+1분</button>
                </div>
            </div>
        </div>

        <div class="tools-panel">
            <button class="tool-btn active" id="btnMoveMode" onclick="setMode('move')">🖐️ 이동 모드</button>
            <button class="tool-btn" id="btnConnectMode" onclick="setMode('connect')">🔗 연결 모드 (배움 릴레이)</button>
            <div style="width: 2px; background:#ddd; margin: 0 5px;"></div>
            <button class="tool-btn" onclick="showInsights()">📊 인사이트</button>
            <button class="tool-btn btn-danger" onclick="clearLines()">🧹 선 지우기</button>
            <button class="tool-btn btn-danger" onclick="resetBoard()">🗑️ 전체 초기화</button>
        </div>

        <canvas id="canvas"></canvas>
    </main>
</div>

<div class="modal-overlay" id="studentModal">
    <div class="modal-content">
        <h3 class="modal-title">⚙️ 학생 명단 관리</h3>
        <div class="add-student-box">
            <input type="text" id="newStudentName" placeholder="새 학생 이름 입력" onkeypress="if(event.key==='Enter') addStudent()">
            <button class="timer-btn play" onclick="addStudent()">추가</button>
        </div>
        <div class="student-edit-list" id="editStudentList"></div>
        <button class="btn-full" onclick="closeModal('studentModal')">닫기</button>
    </div>
</div>

<div class="modal-overlay" id="insightModal">
    <div class="modal-content">
        <h3 class="modal-title">👑 오늘의 배움 나눔 왕</h3>
        <p style="text-align: center; color: #666; margin-top:-10px; margin-bottom: 20px;">친구들에게 도움을 가장 많이 준 학생들입니다!</p>
        <div id="insightList"></div>
        <button class="btn-full" style="margin-top: 15px;" onclick="closeModal('insightModal')">닫기</button>
    </div>
</div>

<div class="modal-overlay" id="alertModal">
    <div class="modal-content" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 10px;">⏰</div>
        <h3 class="modal-title" style="color: var(--accent); font-size: 2rem;">시간 종료!</h3>
        <p style="font-size: 1.2rem; color: #555; margin-bottom: 25px;">모두 수고하셨습니다. 배움을 마무리해주세요.</p>
        <button class="btn-full" onclick="closeModal('alertModal')">확인</button>
    </div>
</div>

<script>
    /* ==========================================
       데이터 및 기본 설정
    ========================================== */
    const EMOJIS = ["🐰", "🐥", "🦊", "🐻", "🐼", "🦁", "🐸", "🐨", "🐯", "🐶", "🐹", "🐵"];
    let students = JSON.parse(localStorage.getItem('tb_students')) || ["김민준", "이서연", "박지우", "최예준", "정윤아", "강도윤"];
    let savedGoal = localStorage.getItem('tb_goal') || "목표: 수익 12~13쪽 해결하기";
    
    let activeCards = {}; // { id: { name, x, y, el } }
    let connections = []; // [{ from: id, to: id }]
    let mode = 'move'; // 'move' or 'connect'

    const board = document.getElementById('board');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // 선 긋기 관련 상태
    let isDrawing = false;
    let startCardId = null;
    let mousePos = { x: 0, y: 0 };
    let dashOffset = 0; // 선 애니메이션 용

    /* ==========================================
       초기화 및 UI 렌더링
    ========================================== */
    function init() {
        document.getElementById('goalInput').value = savedGoal;
        document.getElementById('goalInput').addEventListener('input', (e) => {
            localStorage.setItem('tb_goal', e.target.value);
        });

        renderSidebar();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 캔버스 마우스 이벤트 (연결 모드용)
        board.addEventListener('mousemove', handleMouseMove);
        board.addEventListener('mouseup', handleMouseUp);
        
        // 애니메이션 루프 시작
        requestAnimationFrame(animateCanvas);
    }

    function resizeCanvas() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
    }

    function renderSidebar() {
        const list = document.getElementById('studentList');
        list.innerHTML = '';
        students.forEach((name, index) => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerText = name;
            div.id = `sidebar-item-${index}`;
            div.onclick = () => addCardToBoard(name, index, div);
            list.appendChild(div);
        });
    }

    // 이름으로 랜덤하지만 일정한 이모지 부여
    function getEmoji(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
        return EMOJIS[hash % EMOJIS.length];
    }

    /* ==========================================
       카드 보드 상호작용
    ========================================== */
    function addCardToBoard(name, index, sidebarEl) {
        if(sidebarEl.classList.contains('completed')) return;
        sidebarEl.classList.add('completed');

        const cardId = 'card-' + Date.now();
        const card = document.createElement('div');
        card.className = 'board-card';
        card.id = cardId;
        
        // 초기 생성 위치 (랜덤성 약간 부여)
        const startX = 50 + Math.random() * 50;
        const startY = 150 + Math.random() * 100;
        
        card.style.left = startX + 'px';
        card.style.top = startY + 'px';
        
        card.innerHTML = `<div class="emoji">${getEmoji(name)}</div><div class="name">${name}</div>`;
        board.appendChild(card);

        activeCards[cardId] = { name: name, el: card, sidebarId: sidebarEl.id };

        // 이벤트 리스너 부착
        card.addEventListener('mousedown', (e) => handleCardMouseDown(e, cardId));
    }

    function handleCardMouseDown(e, cardId) {
        if (mode === 'move') {
            // 카드 이동 로직
            e.preventDefault();
            const cardEl = activeCards[cardId].el;
            let startX = e.clientX, startY = e.clientY;
            let origX = cardEl.offsetLeft, origY = cardEl.offsetTop;

            function doDrag(dragEvent) {
                const dx = dragEvent.clientX - startX;
                const dy = dragEvent.clientY - startY;
                cardEl.style.left = (origX + dx) + 'px';
                cardEl.style.top = (origY + dy) + 'px';
            }
            function stopDrag() {
                document.removeEventListener('mousemove', doDrag);
                document.removeEventListener('mouseup', stopDrag);
            }
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
        } 
        else if (mode === 'connect') {
            // 선 긋기 시작
            e.preventDefault();
            e.stopPropagation(); // 보드 배경 드래그 방지
            isDrawing = true;
            startCardId = cardId;
            updateMousePos(e);
        }
    }

    function handleMouseMove(e) {
        if (isDrawing) {
            updateMousePos(e);
        }
    }

    function handleMouseUp(e) {
        if (isDrawing) {
            isDrawing = false;
            const targetCard = e.target.closest('.board-card');
            
            if (targetCard && targetCard.id !== startCardId) {
                // 중복 연결 방지
                const exists = connections.find(c => c.from === startCardId && c.to === targetCard.id);
                if (!exists) {
                    connections.push({ from: startCardId, to: targetCard.id });
                }
            }
            startCardId = null;
        }
    }

    function updateMousePos(e) {
        const rect = board.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;
    }

    /* ==========================================
       모드 전환 및 컨트롤
    ========================================== */
    function setMode(newMode) {
        mode = newMode;
        document.body.setAttribute('data-mode', mode);
        document.getElementById('btnMoveMode').classList.toggle('active', mode === 'move');
        document.getElementById('btnConnectMode').classList.toggle('active', mode === 'connect');
    }

    function clearLines() { connections = []; }
    function resetBoard() {
        if(confirm("보드의 모든 카드와 선을 지우시겠습니까?")) {
            // 카드 엘리먼트 삭제
            Object.values(activeCards).forEach(c => c.el.remove());
            activeCards = {};
            connections = [];
            // 사이드바 비활성화 해제
            document.querySelectorAll('.student-item').forEach(el => el.classList.remove('completed'));
        }
    }

    /* ==========================================
       캔버스 애니메이션 (세련된 곡선)
    ========================================== */
    function getCardCenter(cardId) {
        if(!activeCards[cardId]) return null;
        const el = activeCards[cardId].el;
        return {
            x: el.offsetLeft + el.offsetWidth / 2,
            y: el.offsetTop + el.offsetHeight / 2
        };
    }

    function animateCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dashOffset -= 0.5; // 화살표 흐르는 속도

        // 1. 확정된 연결선 그리기
        connections.forEach(conn => {
            const p1 = getCardCenter(conn.from);
            const p2 = getCardCenter(conn.to);
            if(p1 && p2) drawBezierCurve(p1, p2, false);
        });

        // 2. 현재 긋고 있는 선 그리기
        if (isDrawing && startCardId) {
            const p1 = getCardCenter(startCardId);
            if(p1) drawBezierCurve(p1, mousePos, true);
        }

        requestAnimationFrame(animateCanvas);
    }

    function drawBezierCurve(p1, p2, isTemp) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        
        // 제어점 계산 (곡선 휘어짐 정도)
        const curveOffset = Math.min(distance * 0.2, 80); 
        const cp1x = p1.x + dx/2 - dy/distance * curveOffset;
        const cp1y = p1.y + dy/2 + dx/distance * curveOffset;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.quadraticCurveTo(cp1x, cp1y, p2.x, p2.y);

        if (isTemp) {
            ctx.strokeStyle = '#a4b0be';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            ctx.lineDashOffset = 0;
            ctx.stroke();
        } else {
            // 애니메이션 되는 실선 (그라데이션 느낌)
            ctx.strokeStyle = '#4a90e2';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 10]);
            ctx.lineDashOffset = dashOffset;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 화살표 머리 그리기 (목표 지점 근처)
            const t = 0.85; // 화살표 위치 (0~1)
            const arrowX = (1-t)*(1-t)*p1.x + 2*(1-t)*t*cp1x + t*t*p2.x;
            const arrowY = (1-t)*(1-t)*p1.y + 2*(1-t)*t*cp1y + t*t*p2.y;
            
            // 기울기 계산
            const tx = 2*(1-t)*(cp1x - p1.x) + 2*t*(p2.x - cp1x);
            const ty = 2*(1-t)*(cp1y - p1.y) + 2*t*(p2.y - cp1y);
            const angle = Math.atan2(ty, tx);

            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 12 * Math.cos(angle - Math.PI / 6), arrowY - 12 * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 12 * Math.cos(angle + Math.PI / 6), arrowY - 12 * Math.sin(angle + Math.PI / 6));
            ctx.lineWidth = 4;
            ctx.stroke();
        }
    }

    /* ==========================================
       타이머 기능
    ========================================== */
    let timeRemaining = 20 * 60; // 20분
    let timerInterval = null;
    let isPlaying = false;
    const timeDisplay = document.getElementById('timeDisplay');
    const playBtn = document.getElementById('playBtn');

    function updateTimeDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        timeDisplay.innerText = `${m}:${s}`;
        
        if(timeRemaining <= 60) timeDisplay.style.color = 'var(--accent)';
        else timeDisplay.style.color = 'var(--text-main)';
    }

    function adjustTime(minutes) {
        timeRemaining += minutes * 60;
        if(timeRemaining < 0) timeRemaining = 0;
        updateTimeDisplay();
    }

    function toggleTimer() {
        if(isPlaying) {
            clearInterval(timerInterval);
            playBtn.innerHTML = '▶ 시작';
            playBtn.className = 'timer-btn play';
        } else {
            if(timeRemaining <= 0) return;
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimeDisplay();
                if(timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    toggleTimer();
                    openModal('alertModal'); // 시간 종료 팝업
                }
            }, 1000);
            playBtn.innerHTML = '⏸ 정지';
            playBtn.className = 'timer-btn pause';
        }
        isPlaying = !isPlaying;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isPlaying = false;
        playBtn.innerHTML = '▶ 시작';
        playBtn.className = 'timer-btn play';
        timeRemaining = 20 * 60;
        updateTimeDisplay();
    }

    /* ==========================================
       명단 관리 및 인사이트 (데이터 로직)
    ========================================== */
    function saveStudents() {
        localStorage.setItem('tb_students', JSON.stringify(students));
        renderSidebar();
        renderEditList();
    }

    function addStudent() {
        const input = document.getElementById('newStudentName');
        const name = input.value.trim();
        if(name) {
            students.push(name);
            input.value = '';
            saveStudents();
        }
    }

    function deleteStudent(index) {
        students.splice(index, 1);
        saveStudents();
    }

    function renderEditList() {
        const list = document.getElementById('editStudentList');
        list.innerHTML = '';
        students.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'edit-item';
            div.innerHTML = `<span>${name}</span> <button onclick="deleteStudent(${i})" style="border:none; background:none; cursor:pointer; color:red;">❌</button>`;
            list.appendChild(div);
        });
    }

    function showInsights() {
        const counts = {};
        // 보내는 화살표 수 계산
        connections.forEach(c => { counts[c.from] = (counts[c.from] || 0) + 1; });
        
        let stats = Object.keys(activeCards).map(id => ({
            name: activeCards[id].name,
            count: counts[id] || 0
        })).sort((a, b) => b.count - a.count);

        const list = document.getElementById('insightList');
        list.innerHTML = '';
        
        if(stats.length === 0 || stats[0].count === 0) {
            list.innerHTML = '<p style="text-align:center; color:#888;">아직 기록된 배움 나눔이 없습니다.</p>';
        } else {
            const medals = ["🥇", "🥈", "🥉"];
            stats.forEach((s, i) => {
                if(s.count > 0) {
                    const medal = i < 3 ? medals[i] : `${i+1}.`;
                    list.innerHTML += `<div class="insight-item">
                        <div><span class="insight-rank">${medal}</span> <span style="font-size:1.1rem">${s.name}</span></div>
                        <div class="insight-score">${s.count}번 도움 줌 ✨</div>
                    </div>`;
                }
            });
        }
        openModal('insightModal');
    }

    /* ==========================================
       모달 공통 제어
    ========================================== */
    function openModal(id) {
        if(id === 'studentModal') renderEditList();
        document.getElementById(id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // 실행
    window.onload = init;
</script>
</body>
</html>
